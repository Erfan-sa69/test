<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./swiper/swiper-bundle.min.css">
    <title>git & github</title>
</head>
<body>

    <div class=" w-25 h-25  bg-danger border rounded-4 p-2">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Aperiam ab itaque fugiat! Obcaecati modi fuga maiores minus enim tempora placeat quos debitis amet corporis et commodi laudantium, consequuntur odit magnam?
    </div>
    <button class="btn btn-info"> Hello world</button>
    

    <div dir="rtl" class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
            <img src="https://dkstatics-public.digikala.com/digikala-adservice-banners/10e76c9b94a98c1f18a957c972f3ec9be150b9d1_1794760972.jpg?x-oss-process=image/quality,q_80/format,webp" alt="">
        </div>
        <div class="swiper-slide">
            <img src="https://dkstatics-public.digikala.com/digikala-adservice-banners/8d638b2c3827a1d46ab4856a9e02bc1f3c41661a_1794917733.jpg?x-oss-process=image/quality,q_80/format,webp" alt="">
        </div>
        <div class="swiper-slide">Slide 3</div>
        <div class="swiper-slide">Slide 4</div>
        <div class="swiper-slide">Slide 5</div>
        <div class="swiper-slide">Slide 6</div>
        <div class="swiper-slide">Slide 7</div>
        <div class="swiper-slide">Slide 8</div>

    </div>


    <script src="./bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./swiper/swiper-bundle.min.js"></script>
    <script>
      var swiper = new Swiper('.mySwiper', {
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
      });
    </script>
